<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calque">

<title>Le Calque de Taille</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three":           "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/":   "https://unpkg.com/three@0.158.0/examples/jsm/",
    "exifr":           "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.js"
  }
}
</script>
</head>
<body>

<section id="welcome" class="screen">
  <div class="welcome-inner">
    <h1 data-i18n="welcome.title">Le Calque de Taille</h1>
    <p class="tagline" data-i18n="welcome.tagline">Comparer, améliorer</p>

    <button id="btn-example" class="cta primary" data-i18n="welcome.cta.example">
      Essayer avec un exemple
    </button>
    <button id="btn-own" class="cta secondary" data-i18n="welcome.cta.own">
      Utiliser ma photo et mon STL
    </button>

    <nav class="welcome-footer">
      <button id="lang-toggle" type="button">FR ⇄ EN</button>
    </nav>
    <p class="privacy" data-i18n="welcome.privacy">
      Tout reste sur votre appareil. Aucune image n'est envoyée.
    </p>
  </div>
</section>

<section id="editor" class="screen hidden">
  <div id="stage">
    <!-- photo-frame: sized to match the photo's aspect ratio so the canvas
         overlays the photo exactly. Mesh and mirror poses then become
         device-invariant. See DESIGN_NOTES.md §13. -->
    <div id="photo-frame">
      <img id="photo-img" alt="">
      <canvas id="three-canvas"></canvas>
    </div>
  </div>

  <header id="top-bar" class="chrome">
    <button id="btn-back" type="button" aria-label="Retour">←</button>
    <select id="sample-select" aria-label="Exemple"></select>
    <span id="fov-readout" class="readout"></span>
  </header>

  <footer id="bottom-bar" class="chrome">
    <div class="segmented" role="tablist">
      <button class="seg active" data-mode="reference"
              data-i18n="mode.reference">Référence</button>
      <button class="seg" data-mode="mirror"
              data-i18n="mode.mirror">Miroir</button>
      <button class="seg" data-mode="view"
              data-i18n="mode.view" disabled
              title="V1 — pas encore implémenté">Vue</button>
    </div>
  </footer>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
