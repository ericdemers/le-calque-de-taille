<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calque">

<title>Le Calque de Taille</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three":           "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/":   "https://unpkg.com/three@0.158.0/examples/jsm/",
    "exifr":           "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.js"
  }
}
</script>
</head>
<body>

<section id="welcome" class="screen">
  <div class="welcome-inner">
    <h1 data-i18n="welcome.title">Le Calque de Taille</h1>
    <p class="tagline" data-i18n="welcome.tagline">Comparer, améliorer</p>

    <button id="btn-example" class="cta primary" data-i18n="welcome.cta.example">
      Essayer avec un exemple
    </button>
    <button id="btn-own" class="cta secondary" data-i18n="welcome.cta.own">
      Utiliser ma photo et mon STL
    </button>

    <div id="stl-choice" class="hidden">
      <p class="stl-prompt" data-i18n="welcome.stl.prompt">
        Quel STL voulez-vous utiliser ?
      </p>
      <button class="cta secondary" data-stl="samples/maxilla_lps.stl"
              data-i18n="welcome.stl.maxilla">Exemple : maxillaire</button>
      <button class="cta secondary" data-stl="samples/mandible_lps.stl"
              data-i18n="welcome.stl.mandible">Exemple : mandibule</button>
      <button class="cta secondary" data-stl="file"
              data-i18n="welcome.stl.file">Choisir un fichier STL…</button>
      <button id="stl-cancel" class="link-btn" data-i18n="welcome.stl.cancel">
        Annuler
      </button>
    </div>

    <!-- Persistent file input. iOS Safari is unreliable with file inputs
         created dynamically and not attached to the DOM — onchange fires
         late or not at all after the camera UI suspends the page. -->
    <input id="file-picker" type="file" hidden>

    <nav class="welcome-footer">
      <button id="lang-toggle" type="button">FR ⇄ EN</button>
    </nav>
    <p class="privacy" data-i18n="welcome.privacy">
      Tout reste sur votre appareil. Aucune image n'est envoyée.
    </p>
  </div>
</section>

<section id="editor" class="screen hidden">
  <div id="stage">
    <!-- photo-frame: sized to match the photo's aspect ratio so the canvas
         overlays the photo exactly. Mesh and mirror poses then become
         device-invariant. See DESIGN_NOTES.md §13. -->
    <div id="photo-frame">
      <img id="photo-img" alt="">
      <canvas id="three-canvas"></canvas>
    </div>
  </div>

  <header id="top-bar" class="chrome">
    <button id="btn-back" type="button"
            data-i18n-aria="aria.back" aria-label="Retour">←</button>
    <select id="sample-select"
            data-i18n-aria="aria.sample" aria-label="Exemple"></select>
    <button id="btn-undo" class="icon-btn" type="button"
            data-i18n-aria="control.undo" aria-label="Annuler" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 15L3 9l6-6"/>
        <path d="M3 9h12a6 6 0 0 1 0 12h-3"/>
      </svg>
    </button>
    <button id="focale-chip" class="chip" type="button">
      <span class="chip-label" data-i18n="control.focale">Focale</span>
      <span class="chip-value" id="focale-value">— mm</span>
    </button>
    <button id="btn-settings" class="icon-btn" type="button"
            data-i18n-aria="aria.settings" aria-label="Réglages">⚙</button>
  </header>

  <!-- Refine debug overlay (scaffolding phase). Shows the photo's
       distance-transform image alongside the same image with the current
       silhouette boundary in red. Tap the backdrop or × to dismiss. -->
  <div id="refine-debug" class="sheet hidden" role="dialog"
       aria-labelledby="refine-debug-title">
    <div class="sheet-content refine-debug-content">
      <header class="sheet-header">
        <h3 id="refine-debug-title" data-i18n="refine.debugTitle">
          Distance + silhouette
        </h3>
        <button id="refine-debug-close" class="icon-btn" type="button"
                data-i18n-aria="aria.close" aria-label="Fermer">×</button>
      </header>
      <div id="refine-debug-canvas-wrap"></div>
      <p class="refine-debug-hint" data-i18n="refine.debugHint">
        Gauche : carte de distance. Droite : silhouette du modèle 3D
        superposée, en rouge.
      </p>
    </div>
  </div>

  <div id="secondary-bar" class="chrome">
    <label for="opacity-slider" data-i18n="control.opacity">Opacité</label>
    <input type="range" id="opacity-slider" min="0" max="100" step="1" value="60">
    <span id="opacity-readout" class="readout">60 %</span>

    <!-- Mode-contextual action chip. In Reference mode this is "Caler"
         (run the auto-fit optimiser). In Mirror mode it's "Cacher"
         (remove the mirror disc and pop back to View). Only one chip
         is visible at a time; both are hidden in View mode (when the
         whole secondary bar is hidden anyway). -->
    <button id="btn-snap" class="chip action-chip mode-hidden" type="button"
            data-i18n-aria="aria.snap" aria-label="Caler" disabled>
      <span data-i18n="control.snap">Caler</span>
    </button>
    <button id="btn-hide-mirror" class="chip action-chip mode-hidden" type="button"
            data-i18n-aria="aria.hideMirror" aria-label="Cacher le miroir">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7c2.3 0 4.2.7 5.7 1.7"/>
        <path d="M22 12s-3.5 7-10 7c-2.3 0-4.2-.7-5.7-1.7"/>
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>
      <span data-i18n="control.hideMirror">Cacher</span>
    </button>
  </div>

  <!-- Focale popover: anchored near the chip in the top bar -->
  <div id="focale-popover" class="popover hidden" role="dialog"
       aria-labelledby="focale-popover-label">
    <label id="focale-popover-label" for="focale-slider"
           data-i18n="control.focale">Focale</label>
    <input type="range" id="focale-slider" min="8" max="400" step="1" value="26">
    <span id="focale-readout" class="readout">26 mm</span>
  </div>

  <!-- Settings sheet: opens from the gear icon -->
  <div id="settings-sheet" class="sheet hidden" role="dialog"
       aria-labelledby="settings-title">
    <div class="sheet-content">
      <header class="sheet-header">
        <h3 id="settings-title" data-i18n="settings.title">Réglages</h3>
        <button id="settings-close" class="icon-btn" type="button"
                data-i18n-aria="aria.close" aria-label="Fermer">×</button>
      </header>
      <div class="setting-row">
        <label for="mirror-diameter-slider"
               data-i18n="settings.mirrorDiameter">Diamètre du miroir</label>
        <input type="range" id="mirror-diameter-slider"
               min="6" max="40" step="1" value="22">
        <span id="mirror-diameter-readout" class="readout">22 mm</span>
      </div>
    </div>
  </div>

  <footer id="bottom-bar" class="chrome">
    <div class="segmented" role="tablist">
      <button class="seg active" data-mode="view"
              data-i18n="mode.view">Vue</button>
      <button class="seg" data-mode="reference"
              data-i18n="mode.reference">Référence</button>
      <button class="seg" data-mode="mirror"
              data-i18n="mode.mirror">Miroir</button>
    </div>
  </footer>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
